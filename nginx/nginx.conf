server {
    listen 80;

    # DNS interno de Docker. Con valid=5s Nginx vuelve a resolver "api" seguido
    # y reparte entre todas las réplicas que existan en ese momento.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
